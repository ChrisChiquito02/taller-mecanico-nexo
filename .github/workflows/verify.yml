name: Verify ExamenErik
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sistema-m01-m02/pom.xml
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: ./mvnw -B -ntp verify
        working-directory: sistema-m01-m02
      - run: python3 sistema-m01-m02/scripts/smoke-isolated.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: python3 scripts/verificar-documentacion.py
